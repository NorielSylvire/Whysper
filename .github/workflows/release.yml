name: Package and Release Addon

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so changelog generation works properly

      - name: Extract Latest Release Notes
        run: |
          awk '/^## v[0-9]/{if(found) exit; found=1} found' CHANGELOG.md > RELEASE_NOTES.md

      - name: Package and Publish Addon
        id: packager
        uses: BigWigsMods/packager@v2.5.1
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # Don't upload to GitHub here, we'll do it separately with RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: ${{ steps.packager.outputs.archive_path }}
